name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify gofmt
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          files="$(gofmt -l ./cmd ./internal)"
          if [ -n "$files" ]; then
            echo "These files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Run focused race tests
        if: runner.os == 'Linux'
        run: go test -race ./internal/session ./internal/httpapi ./internal/runtime

      - name: Build packages
        run: go build ./...

      - name: Cross-build release targets
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            output="${RUNNER_TEMP}/copilot-sdkapi-${goos}-${goarch}"
            if [ "$goos" = "windows" ]; then
              output="${output}.exe"
            fi
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -o "$output" ./cmd/copilot-sdkapi
          done
