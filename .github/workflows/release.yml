name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: copilot-sdkapi

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    env:
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Compute version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="$REF_NAME"
          else
            version="snapshot-${GITHUB_SHA::7}"
          fi

          publish=false
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" == v* ]]; then
            publish=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release candidate
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run focused race tests
        run: go test -race ./internal/session ./internal/httpapi ./internal/runtime

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - prepare
      - verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Generate embedded CLI
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go tool bundler \
            --platform "${TARGET_GOOS}/${TARGET_GOARCH}" \
            --output ./internal/embeddedcli

          gofile="./internal/embeddedcli/zcopilot_${TARGET_GOOS}_${TARGET_GOARCH}.go"
          tmpfile=$(mktemp)
          {
            printf '//go:build %s && %s\n\n' "$TARGET_GOOS" "$TARGET_GOARCH"
            sed 's/^package main$/package embeddedcli/' "$gofile"
          } > "$tmpfile"
          mv "$tmpfile" "$gofile"

      - name: Build release package
        id: package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.prepare.outputs.version }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          package_dir="${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}"
          binary_name="${APP_NAME}${EXT}"

          mkdir -p "dist/${package_dir}"
          GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -o "dist/${package_dir}/${binary_name}" ./cmd/gateway

          cp README.md LICENSE "dist/${package_dir}/"

          if [[ "$GOOS" != "windows" ]]; then
            chmod +x "dist/${package_dir}/${binary_name}"
            tar -C dist -czf "dist/${package_dir}.tar.gz" "${package_dir}"
            echo "asset=dist/${package_dir}.tar.gz" >> "$GITHUB_OUTPUT"
          else
            (
              cd dist
              zip -r "${package_dir}.zip" "${package_dir}" >/dev/null
            )
            echo "asset=dist/${package_dir}.zip" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.asset }}
          retention-days: 30

  bundle:
    name: Bundle release artifacts
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum * | sort > checksums.txt

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ needs.prepare.outputs.version }}
          path: release/*
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - bundle
    runs-on: ubuntu-latest
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ needs.prepare.outputs.version }}
          path: release

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/*
          fail_on_unmatched_files: true
